name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest -q

  windows-exe:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pyinstaller
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: pico-slimevr-windows
          path: dist/pico-slimevr.exe
      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: pico-slimevr (latest)
          body: |
            Автоматическая сборка pico-slimevr.exe (Python не нужен).
            Скачайте pico-slimevr.exe и запустите, либо возьмите pico-slimevr.bat.
          files: dist/pico-slimevr.exe
          make_latest: true
      - name: Attach to versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pico-slimevr.exe
