[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-slimevr"
version = "0.1.0"
description = "Route PICO Motion Trackers through SlimeVR Server (SteamVR feeder pipeline)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
pico-slimevr = "pico_slimevr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
